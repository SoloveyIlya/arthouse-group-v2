<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Спасибо за заявку | Art House</title>
    <link rel="icon" type="image/x-icon" href="./media/logos/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <style>
        .thank-you-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--black);
            position: relative;
            overflow: hidden;
        }

        .thank-you-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .thank-you-content {
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .thank-you-icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 60px rgba(255, 215, 0, 0.4);
            animation: luxuryPulse 2s ease-in-out infinite;
        }

        .thank-you-icon svg {
            width: 60px;
            height: 60px;
            color: #000;
        }

        .thank-you-title {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            color: var(--white);
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .thank-you-message {
            font-size: clamp(1rem, 2.5vw, 1.25rem);
            color: var(--gray-300);
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: var(--black);
            font-weight: 600;
            font-size: 1rem;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            overflow: hidden;
        }

        .back-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .back-button:hover::before {
            left: 100%;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
        }

        .back-button:active {
            transform: translateY(0);
        }

        @keyframes luxuryPulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 20px 60px rgba(255, 215, 0, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 25px 70px rgba(255, 215, 0, 0.6);
            }
        }

        @media (max-width: 768px) {
            .thank-you-container {
                padding: 1rem;
            }

            .thank-you-icon {
                width: 100px;
                height: 100px;
            }

            .thank-you-icon svg {
                width: 50px;
                height: 50px;
            }

            .thank-you-message {
                margin-bottom: 2rem;
            }
        }
    </style>
    <script src="translations.js"></script>
    <script>
        // Initialize translations when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof setLanguage === 'function') {
                const savedLang = localStorage.getItem('language') || 'ru';
                setLanguage(savedLang);
            }
        });
    </script>

</head>
<body>
    <div class="thank-you-container">
        <div class="thank-you-content luxury-fade-in">
            <div class="thank-you-icon">
                <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
            </div>
            <h1 class="thank-you-title" data-i18n="thank-you.title">Спасибо за заявку!</h1>
            <p class="thank-you-message" data-i18n="thank-you.message">
                Ваш запрос успешно отправлен. Мы свяжемся с вами в ближайшее время.
            </p>
            <a href="index.html" class="back-button" data-i18n="thank-you.back">Вернуться на сайт</a>
        </div>
    </div>
</body>
</html>
